name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      enable_terminal:
        type: boolean
        description: 'Enable terminal session.'
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php-versions }}, Behat ${{ matrix.behat }}, Deps ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
        behat: ['3', '4']
        deps: ['normal', 'lowest']

    services:
      chrome:
        image: selenium/standalone-chromium:152.0@sha256:08fd293648e126275782c616a61f4ee1d90cf413b1972ebc35dbd054d6789f55
        ports:
          - 4444:4444

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-behat-${{ matrix.behat }}-${{ matrix.deps }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: gd
          coverage: pcov
          ini-values: pcov.directory=.

      - name: Install dependencies
        run: |
          # dmore/behat-chrome-extension 1.x requires Behat 3, so Behat 4 jobs
          # remove it and skip the @headless scenarios that use it.
          if [ "${{ matrix.behat }}" == "4" ]; then
            composer remove --dev --no-update dmore/behat-chrome-extension
          fi

          if [ "${{ matrix.deps }}" == "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --with="behat/behat:^${{ matrix.behat }}"
          else
            composer update --with="behat/behat:^${{ matrix.behat }}"
          fi

      - name: Validate composer.json
        run: |
          composer --verbose validate
          composer normalize --dry-run

      - name: Check coding standards
        if: matrix.php-versions == '8.3' && matrix.deps == 'normal'
        run: composer lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Run unit tests
        run: composer test-coverage
        continue-on-error: ${{ vars.CI_TEST_UNIT_IGNORE_FAILURE == '1' }}

      - name: Setup Chrome
        if: matrix.behat == '3'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2

      - name: Start Chrome
        if: matrix.behat == '3'
        run: chrome --no-sandbox --headless --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222&

      - name: Run BDD tests
        run: composer test-bdd ${{ matrix.behat == '4' && '-- --tags=~@headless' || '' }}
        continue-on-error: ${{ vars.CI_TEST_BDD_IGNORE_FAILURE == '1' }}
        env:
          BEHAT_JAVASCRIPT_BASE_URL: http://172.17.0.1:8888

      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{github.job}}-logs-${{ matrix.php-versions }}-behat${{ matrix.behat }}-${{ matrix.deps }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ matrix.behat == '3' && matrix.deps == 'normal' && env.CODECOV_TOKEN != '' }}
        with:
          files: .logs/junit.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ matrix.behat == '3' && matrix.deps == 'normal' && env.CODECOV_TOKEN != '' }}
        with:
          files: |
            .logs/coverage/behat/cobertura.xml
            .logs/coverage/phpunit/cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup tmate session
        if: ${{ !cancelled() && github.event.inputs.enable_terminal }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 15
